<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #fffbeb; min-height: 100vh; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', sans-serif;
  padding: 1rem;
  color: #78350f;
}
.app { max-width: 480px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 1.25rem; }
.title { font-size: 1.75rem; font-weight: 800; color: #78350f; margin-bottom: 0.25rem; letter-spacing: -0.02em; }
.subtitle { font-size: 0.875rem; color: #b45309; }
.celebration {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #fff;
  padding: 1rem 1.25rem;
  border-radius: 1rem;
  text-align: center;
  margin-bottom: 1rem;

}
.celebration-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.25rem; }
.celebration-sub { font-size: 0.875rem; opacity: 0.95; }
.stats {
  display: flex;

  align-items: center;
  background: #fff;
  padding: 0.75rem 1rem;
  border-radius: 0.875rem;
  margin-bottom: 0.875rem;
  box-shadow: 0 1px 3px rgba(120, 53, 15, 0.08);
  gap: 0.5rem;
}
.stat { font-size: 0.8125rem; color: #92400e; font-weight: 600; display: flex; align-items: baseline; gap: 0.375rem; }
.stat-value { font-size: 1.125rem; color: #d97706; font-weight: 800; }
.controls { display: flex; gap: 0.375rem; margin-left: auto; }
.btn {

  border: none;
  border-radius: 0.5rem;
  background: #d97706;
  color: #fff;

  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s;
  font-family: inherit;
}
.btn:hover { background: #b45309; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-icon { background: #fef3c7; color: #92400e; min-width: 2.25rem; padding: 0.5rem 0.625rem; }
.btn-icon:hover { background: #fde68a; }
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.5rem;
  margin-bottom: 1rem;
}
.card {
  aspect-ratio: 1;
  perspective: 800px;
  cursor: pointer;
}
.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
  transform-style: preserve-3d;
}
.card.flipped .card-inner,
.card.matched .card-inner { transform: rotateY(180deg); }
.card-face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 0.75rem;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  font-size: clamp(1.5rem, 8vw, 2.25rem);
  user-select: none;
}
.card-back {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #fff;
  box-shadow: 0 2px 6px rgba(217, 119, 6, 0.3);
}
.card-back::after {
  content: '';
  position: absolute;
  inset: 4px;
  border: 2px dashed rgba(255, 255, 255, 0.35);
  border-radius: 0.5rem;
}
.card-front {
  background: #fff;
  border: 2px solid #fde68a;
  transform: rotateY(180deg);
}
.card.matched .card-front {
  background: #fef3c7;
  border-color: #d97706;
  box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.25);
}
.card:not(.flipped):not(.matched):hover .card-inner {
  transform: translateY(-2px) rotateX(4deg);
}
.record {
  background: #fff;
  padding: 0.875rem 1rem;
  border-radius: 0.875rem;
  text-align: center;
  box-shadow: 0 1px 3px rgba(120, 53, 15, 0.08);
}
.record-label { font-size: 0.75rem; color: #92400e; margin-bottom: 0.25rem; font-weight: 600; }
.record-value { font-size: 1rem; color: #78350f; font-weight: 700; }
.record-empty { color: #b45309; font-weight: 500; font-size: 0.875rem; }
@keyframes pop {
  0% { transform: scale(0.85); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
@media (max-width: 380px) {
  body { padding: 0.75rem; }
  .grid { gap: 0.375rem; }
  .title { font-size: 1.5rem; }
  .stats { padding: 0.625rem 0.75rem; }
  .stat { font-size: 0.75rem; }
  .stat-value { font-size: 1rem; }
  .btn { padding: 0.4375rem 0.75rem; font-size: 0.75rem; }
}
</style>
